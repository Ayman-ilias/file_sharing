# File bytes sent by X-Accel-Redirect. nginx keeps only Content-Type, Content-Disposition,
# Cache-Control, Expires, Set-Cookie and Accept-Ranges from the API, so the rest is added here.
internal;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy $fs_csp always;
