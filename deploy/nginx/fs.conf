# Southern IoT Files v2 — the only published service (plan 5). See deploy/RUNBOOK.md.
server_tokens off;
client_max_body_size 20m;  # one 16 MiB upload chunk + margin; also covers vault meta and texts
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Clients allowed to connect: the reverse proxy (TRUSTED_PROXIES, written at start by
# 40-trusted-proxies.sh) and this container itself (healthcheck).
geo $fs_trusted {
    default 0;
    127.0.0.1 1;
    include /tmp/trusted.geo;
}
# The real client IP for the API's login rate limit: CF-Connecting-IP set by Cloudflare,
# else the connecting address. Never X-Forwarded-For (its first hop is client-controlled).
map "$fs_trusted|$http_cf_connecting_ip" $fs_real_ip {
    "~^1\|(?<cf>.+)$" $cf;
    default $remote_addr;
}
map $sent_http_content_type $fs_csp {
    ~^application/pdf "";
    ~^(image|video)/ "sandbox";
    default "";
}

upstream fs_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    if ($fs_trusted = 0) {
        return 403;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $fs_real_ip;
    proxy_set_header X-Forwarded-For "";

    location / {
        include /etc/nginx/fs/security-headers.conf;
        try_files $uri /index.html;
    }
    location = /index.html {
        include /etc/nginx/fs/security-headers.conf;
        add_header Cache-Control no-cache always;
    }
    location /assets/ {
        include /etc/nginx/fs/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The API sends its own nosniff / X-Frame-Options / Referrer-Policy.
    location /api/ {
        proxy_pass http://fs_api;
    }
    # Exact match too: a proxied prefix location ending in "/" answers the bare path with a 301.
    location = /api/uploads {
        proxy_pass http://fs_api;
    }
    location /api/uploads/ {
        proxy_pass http://fs_api;
        proxy_request_buffering off;  # stream chunks to the API, no copy on this disk
        proxy_read_timeout 120s;
    }
    location = /api/events {
        proxy_pass http://fs_api;
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no always;  # tell the outer proxy not to buffer either
    }
    location ~ ^/api/items/[^/]+/zip$ {
        proxy_pass http://fs_api;
        proxy_buffering off;  # zips are streamed; don't spool them to /tmp
        proxy_read_timeout 1h;
    }

    # Only the two file folders; the database next to them is never reachable.
    location /protected/files/ {
        include /etc/nginx/fs/protected-headers.conf;
        alias /data/files/;
    }
    location /protected/vault/ {
        include /etc/nginx/fs/protected-headers.conf;
        alias /data/vault/;
    }
    location /protected/ {
        internal;
        return 404;
    }
}
